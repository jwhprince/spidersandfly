<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><title>Проверка игровых правил</title><script src="../game-core.js" defer></script><script src="game-core.test.js" defer></script></head><body style="background:#101611;color:#d3ee9b;font:15px monospace;padding:32px"><h1>Проверка игровых правил</h1><pre id="results"></pre><script>window.addEventListener('DOMContentLoaded', () => { document.getElementById('results').textContent = window.__testResults.map(test => `${test.passed ? 'PASS' : 'FAIL'}  ${test.name}${test.error ? '\n      ' + test.error : ''}`).join('\n\n'); });</script></body></html>
